<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Student Performance</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0b0b12;color:white;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{width:100%;max-width:440px;background:#151521;padding:34px 30px;border-radius:20px;border:1px solid #29293a;box-shadow:0 0 35px rgba(180,80,255,.15)}
.logo{text-align:center;font-size:24px;font-weight:bold;margin-bottom:10px;background:linear-gradient(90deg,#ff5fbc,#8f63ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:#aaaabd;font-size:14px;margin-bottom:25px}
.group{margin-bottom:16px}
label{display:block;margin-bottom:7px;font-size:14px;color:#d0d0dc}
input,select{width:100%;padding:12px;background:#0f0f18;color:white;border:1px solid #303044;border-radius:10px;font-size:14px}
button{width:100%;padding:13px;border:0;border-radius:10px;color:white;font-size:15px;font-weight:bold;cursor:pointer;background:linear-gradient(90deg,#ff5fbc,#8f63ff);margin-top:8px}
.error{background:rgba(255,80,100,.1);border:1px solid rgba(255,80,100,.3);color:#ff8c9c;padding:10px;border-radius:8px;margin-bottom:16px;text-align:center;font-size:13px}
a{display:block;text-align:center;color:#d4a2ff;text-decoration:none;margin-top:20px;font-size:14px}
.note{color:#aaaabd;font-size:12px;line-height:1.5;margin-top:12px}


/* Responsive layout additions */
html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

body {
    max-width: 100%;
    overflow-wrap: break-word;
}

img, canvas, video, svg {
    max-width: 100%;
}

input, select, textarea, button {
    max-width: 100%;
    font: inherit;
}

input, select, textarea {
    min-width: 0;
}

table {
    max-width: 100%;
}

@media (max-width: 768px) {
    body {
        padding-left: 14px !important;
        padding-right: 14px !important;
    }

    .container, .page, .login-container, main {
        width: 100% !important;
        max-width: 100% !important;
    }

    .navbar, nav.navbar {
        flex-wrap: wrap;
        gap: 12px;
    }

    .nav-right, .nav-links, .nav-actions {
        flex-wrap: wrap;
        gap: 8px;
        max-width: 100%;
    }

    .navbar a, button, .btn {
        overflow-wrap: anywhere;
    }

    table {
        display: block;
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    input, select, textarea {
        width: 100%;
        min-height: 42px;
    }

    img, canvas {
        height: auto;
    }
}

@media (max-width: 480px) {
    body {
        padding-top: 14px !important;
        padding-bottom: 14px !important;
    }

    h1 {
        font-size: clamp(1.45rem, 6vw, 2rem);
        overflow-wrap: anywhere;
    }

    h2 {
        font-size: clamp(1.15rem, 5vw, 1.5rem);
    }

    .container, .page, .login-container {
        padding-left: 12px;
        padding-right: 12px;
    }

    .navbar {
        align-items: flex-start;
    }

    .nav-right, .nav-links, .nav-actions {
        width: 100%;
    }

    button, .btn {
        min-height: 40px;
    }
}


/* Shared mobile usability improvements */
@media (max-width: 600px) {
    html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
    }

    body {
        max-width: 100%;
        overflow-x: hidden;
    }

    main, .container, .content, .dashboard-container,
    .form-container, .card, .section, .input-summary {
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
    }

    button, input[type="submit"], input[type="button"],
    .btn, .button, .action-button, .export-button,
    .back-button, .predict-button, .login-button {
        box-sizing: border-box;
        min-height: 44px;
        max-width: 100%;
        white-space: normal;
        overflow-wrap: anywhere;
        line-height: 1.35;
        touch-action: manipulation;
    }

    input, select, textarea {
        box-sizing: border-box;
        max-width: 100%;
        min-width: 0;
        font-size: 16px;
    }

    .navbar, nav.navbar, nav {
        max-width: 100%;
        box-sizing: border-box;
    }

    .nav-links, .nav-right, .nav-actions {
        min-width: 0;
        max-width: 100%;
        flex-wrap: wrap;
        gap: 8px;
    }

    table {
        max-width: 100%;
    }

    img, canvas, video {
        max-width: 100%;
        height: auto;
    }
}

@media (max-width: 400px) {
    button, input[type="submit"], .btn, .button,
    .action-button, .export-button, .back-button,
    .predict-button, .login-button {
        padding: 10px 12px;
        font-size: 14px;
    }
}

</style>
</head>
<body>
<div class="container">
<div class="logo">Create Account</div>
<p class="subtitle">AI-Based Student Analytics System</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form action="/register" method="POST">
<div class="group">
<label for="role">Register as</label>
<select name="role" id="role" required>
<option value="student">Student</option>
<option value="teacher">Teacher</option>
</select>
</div>
<div class="group">
<label for="username">Username</label>
<input id="username" name="username" minlength="3" required autocomplete="username" placeholder="Create username">
</div>
<div class="group">
<label for="password">Password (minimum 8 characters)</label>
<input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="Create password">
</div>
<div id="studentFields">
<div class="group">
<label for="student_name">Full name</label>
<input id="student_name" name="student_name" autocomplete="name" placeholder="Enter your registered name">
</div>
<div class="group">
<label for="student_id">Registered Student ID</label>
<input id="student_id" name="student_id" placeholder="Enter your official Student ID">
</div>
</div>
<div id="teacherFields" style="display:none">
<div class="group">
<label for="teacher_code">Teacher registration code</label>
<input id="teacher_code" name="teacher_code" type="password" autocomplete="off" placeholder="Enter code provided by administrator">
</div>
<p class="note">Teacher registration requires an administrator-configured code.</p>
</div>
<button type="submit">Create Account</button>
</form>
<a href="/login">Already registered? Log in</a>
</div>
<script>
const role = document.getElementById("role");
const studentFields = document.getElementById("studentFields");
const teacherFields = document.getElementById("teacherFields");
const studentName = document.getElementById("student_name");
const studentId = document.getElementById("student_id");
const teacherCode = document.getElementById("teacher_code");
function updateFields(){
  const isTeacher = role.value === "teacher";
  studentFields.style.display = isTeacher ? "none" : "block";
  teacherFields.style.display = isTeacher ? "block" : "none";
  studentName.required = !isTeacher;
  studentId.required = !isTeacher;
  teacherCode.required = isTeacher;
}
role.addEventListener("change", updateFields);
updateFields();
</script>
</body>
</html>
