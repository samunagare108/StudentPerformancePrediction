<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Progress</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0b12;
            color: white;
            min-height: 100vh;
        }

        nav {
            background: #12121c;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #292936;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(90deg, #ff4ecd, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #ddd;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #ff4ecd;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 25px;
        }

        .heading {
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #aaa;
            font-size: 15px;
        }

        .chart-card {
            background: #13131e;
            border: 1px solid #292936;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }

        .chart-title {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .chart-container {
            position: relative;
            height: 420px;
        }

        .empty {
            text-align: center;
            padding: 80px 20px;
            color: #aaa;
        }

        .empty h2 {
            color: white;
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            background: linear-gradient(90deg, #ff4ecd, #8b5cf6);
            font-weight: bold;
        }

        @media (max-width: 700px) {
            nav {
                padding: 15px 20px;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links a {
                font-size: 12px;
            }

            .container {
                margin: 30px auto;
                padding: 0 15px;
            }

            .heading h1 {
                font-size: 26px;
            }

            .chart-card {
                padding: 18px;
            }

            .chart-container {
                height: 320px;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">
        Student Performance AI
    </div>

    <div class="nav-links">
        <a href="{{ url_for('teacher_dashboard') if session.get('role', '')|lower == 'teacher' else url_for('student_dashboard') }}">Dashboard</a>
        <a href="/predict-form">Predict</a>
        <a href="/student-history">History</a>
        <a href="/logout">Logout</a>
    </div>
</nav>

<div class="container">

    <div class="heading">
        <h1>My Progress</h1>
        <p>Track how your predicted performance changes over time.</p>
    </div>

    {% if scores %}

    <div class="chart-card">

        <div class="chart-title">
            Prediction Score Trend
        </div>

        <div class="chart-container">
            <canvas id="progressChart"></canvas>
        </div>

    </div>

    <script>
        const scores = {{ scores | tojson }};

        const labels = scores.map((score, index) => {
            return "Prediction " + (index + 1);
        });

        const ctx = document.getElementById("progressChart");

        new Chart(ctx, {
            type: "line",

            data: {
                labels: labels,

                datasets: [{
                    label: "Predicted Score",
                    data: scores,

                    borderWidth: 3,
                    tension: 0.35,

                    pointRadius: 5,
                    pointHoverRadius: 7,

                    fill: false
                }]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,

                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,

                        ticks: {
                            color: "#aaa"
                        },

                        grid: {
                            color: "#292936"
                        }
                    },

                    x: {
                        ticks: {
                            color: "#aaa"
                        },

                        grid: {
                            color: "#292936"
                        }
                    }
                },

                plugins: {
                    legend: {
                        labels: {
                            color: "#ddd"
                        }
                    }
                }
            }
        });
    </script>

    {% else %}

    <div class="chart-card">

        <div class="empty">

            <h2>No Progress Data Yet</h2>

            <p>
                Make your first prediction to start tracking your progress.
            </p>

            <a href="/predict-form" class="btn">
                Make Prediction
            </a>

        </div>

    </div>

    {% endif %}

</div>

</body>
</html>
